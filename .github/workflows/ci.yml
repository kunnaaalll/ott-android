name: OTT Platform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  # ── Backend: Firebase Functions ─────────────────────────────────────────────
  backend-test:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Run backend tests
        run: npm test -- --forceExit --passWithNoTests

      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true  # Report but don't block on low-severity issues

  # ── Android ─────────────────────────────────────────────────────────────────
  android-test:
    name: Android Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Run Android unit tests
        run: ./gradlew test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: app/build/reports/tests/

  # ── Security Scan ──────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Leak Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE required for private repos
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ── Firebase Deploy (main branch only) ─────────────────────────────────────
  deploy-staging:
    name: Deploy to Firebase (Staging)
    needs: [ backend-test, android-test, secret-scan ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Deploy Firebase Functions (staging)
        run: firebase deploy --only functions --project=YOUR_STAGING_PROJECT_ID --token=${{ secrets.FIREBASE_TOKEN }}
        # FIREBASE_TOKEN: Set in GitHub Environments → Secrets (not repo secrets)
        # This token must only have Functions deploy permissions, not admin access

  # Production deploy requires manual approval via GitHub Environments
  deploy-production:
    name: Deploy to Firebase (Production)
    needs: [ backend-test, android-test, secret-scan ]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://your-firebase-project.web.app
    # Requires a reviewer to approve in GitHub Environments settings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Deploy Firebase Functions (production)
        run: firebase deploy --only functions,firestore:rules --project=YOUR_PRODUCTION_PROJECT_ID --token=${{ secrets.FIREBASE_TOKEN_PROD }}
